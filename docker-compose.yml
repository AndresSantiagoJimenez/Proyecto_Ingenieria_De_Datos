x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/Dockerfile.airflow
  image: data-platform-airflow:2.8.2
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres:5432/${POSTGRES_DB:-airflow}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:-46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLbfzqJZPo=}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
    AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: 10
    PYTHONPATH: /opt/airflow:/opt/airflow/src
    DATA_DIR: /opt/airflow/data
    BRONZE_PATH: /opt/airflow/data/bronze
    SILVER_PATH: /opt/airflow/data/silver
    GOLD_PATH: /opt/airflow/data/gold
    QUARANTINE_PATH: /opt/airflow/data/quarantine
    RAW_DATA_PATH: /opt/airflow/data/raw
    SAMPLE_DATA_PATH: /opt/airflow/data/sample
  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - ./configs:/opt/airflow/configs
    - ./data:/opt/airflow/data
    - ./logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy
  networks:
    - lakehouse-net

services:
  # ----------------------------------------------------------------------------
  # Airflow Metadata Database (PostgreSQL)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: lakehouse-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airflow}
      POSTGRES_DB: ${POSTGRES_DB:-airflow}
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-airflow}"]
      interval: 5s
      retries: 5
    networks:
      - lakehouse-net
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # Airflow Database Initializer
  # ----------------------------------------------------------------------------
  airflow-init:
    <<: *airflow-common
    container_name: lakehouse-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate && \
        airflow users create \
          --role Admin \
          --username ${_AIRFLOW_WWW_USER_USERNAME:-airflow} \
          --password ${_AIRFLOW_WWW_USER_PASSWORD:-airflow} \
          --firstname Data \
          --lastname Engineer \
          --email admin@example.com || true
    restart: "no"

  # ----------------------------------------------------------------------------
  # Airflow Webserver (UI)
  # ----------------------------------------------------------------------------
  airflow-webserver:
    <<: *airflow-common
    container_name: lakehouse-airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ----------------------------------------------------------------------------
  # Airflow Scheduler
  # ----------------------------------------------------------------------------
  airflow-scheduler:
    <<: *airflow-common
    container_name: lakehouse-airflow-scheduler
    command: scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ----------------------------------------------------------------------------
  # Apache Spark (Standalone Master Node)
  # ----------------------------------------------------------------------------
  spark-master:
    image: bitnami/spark:3.5.1
    container_name: lakehouse-spark-master
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    ports:
      - "7077:7077"
      - "8081:8081"
    volumes:
      - ./data:/opt/spark/data
      - ./src:/opt/spark/src
    networks:
      - lakehouse-net
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # Apache Spark (Standalone Worker Node)
  # ----------------------------------------------------------------------------
  spark-worker:
    image: bitnami/spark:3.5.1
    container_name: lakehouse-spark-worker
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    volumes:
      - ./data:/opt/spark/data
      - ./src:/opt/spark/src
    depends_on:
      - spark-master
    networks:
      - lakehouse-net
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # SonarQube Server (Code Quality / SAST - Optional Profile)
  # ----------------------------------------------------------------------------
  sonarqube:
    image: sonarqube:community
    container_name: lakehouse-sonarqube
    ports:
      - "9000:9000"
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions
      - sonarqube-logs:/opt/sonarqube/logs
    networks:
      - lakehouse-net
    profiles:
      - quality
      - all

  # ----------------------------------------------------------------------------
  # Jenkins CI/CD Controller (Optional Profile)
  # ----------------------------------------------------------------------------
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: lakehouse-jenkins
    ports:
      - "8082:8080"
      - "50000:50000"
    volumes:
      - jenkins-home:/var/jenkins_home
    networks:
      - lakehouse-net
    profiles:
      - ci
      - all

volumes:
  postgres-db-volume:
  sonarqube-data:
  sonarqube-extensions:
  sonarqube-logs:
  jenkins-home:

networks:
  lakehouse-net:
    driver: bridge
