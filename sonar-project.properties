# ==============================================================================
# SonarQube / SonarCloud Project Configuration
# ==============================================================================

# Project Identification
sonar.projectKey=data-engineering-platform-olist
sonar.projectName=Data Engineering Platform - Olist
sonar.projectVersion=0.1.0

# Source & Test Code Directories
sonar.sources=src
sonar.tests=tests

# Encodings & Languages
sonar.sourceEncoding=UTF-8
sonar.python.version=3.10,3.11

# Test Coverage & Execution Reports
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=test-results.xml

# Inclusions & Exclusions
sonar.exclusions=**/__pycache__/**,data/**,docs/**,scripts/**,dags/**,spark-warehouse/**,.pytest_cache/**,coverage.xml,test-results.xml
sonar.coverage.exclusions=tests/**,scripts/**,dags/**,setup.py

# Quality Gate Enforcement
sonar.qualitygate.wait=true

